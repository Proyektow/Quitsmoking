<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icono.svg">
  <title>CeroHumo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0e12;
      --card: #151820;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-dim: #9ca3af;
      --text-muted: #6b7280;
      --accent: #10b981;
      --accent-subtle: rgba(16, 185, 129, 0.12);
      --danger: #ef4444;
      --danger-subtle: rgba(239, 68, 68, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 20px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
    }

    .hero-stat {
      text-align: center;
      padding: 6px 0;
    }

    .hero-label {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .hero-value {
      font-family: 'Space Mono', monospace;
      font-size: clamp(4.5rem, 16vw, 6.5rem);
      font-weight: 700;
      line-height: 1;
      margin: 12px 0 6px 0;
      color: var(--text);
    }

    .hero-sub {
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 600;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .metric-item {
      text-align: center;
    }

    .metric-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .metric-value {
      font-family: 'Space Mono', monospace;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .metric-value.smoke-today {
      color: var(--danger);
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-clean {
      background: var(--accent-subtle);
      border-color: rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .btn-relapse {
      background: var(--danger-subtle);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .btn-sos {
      grid-column: span 2;
      background: #1e2330;
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.12);
    }

    /* CALENDARIO */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .cal-title {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text);
      text-transform: capitalize;
    }

    .cal-nav-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-dim);
      position: relative;
    }

    .day-cell.empty { background: transparent; }
    .day-cell.today { border: 1px solid rgba(255, 255, 255, 0.35); }

    .day-cell.clean {
      background: var(--accent-subtle);
      color: #34d399;
      font-weight: 600;
    }

    .day-cell.relapse {
      background: var(--danger-subtle);
      color: #f87171;
      font-weight: 600;
    }

    .day-cell-count {
      font-size: 0.65rem;
      line-height: 1;
      margin-top: 2px;
      opacity: 0.85;
    }

    /* AJUSTE SEMANAL */
    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .settings-input {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 0.95rem;
      width: 90px;
      text-align: right;
      outline: none;
    }

    /* MODAL SOS */
    .sos-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(12, 14, 18, 0.96);
      z-index: 1000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    .breath-box {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 2px solid var(--text-dim);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 26px 0;
      animation: pulse 6s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.92); border-color: rgba(255,255,255,0.2); }
      50% { transform: scale(1.15); border-color: var(--accent); }
    }

    .breath-clock {
      font-family: 'Space Mono', monospace;
      font-size: 2.2rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- TARJETA PRINCIPAL -->
  <div class="card">
    <div class="hero-stat">
      <div class="hero-label">Racha Sin Fumar</div>
      <div class="hero-value" id="streak-days">0</div>
      <div class="hero-sub" id="streak-text">Días limpios</div>
    </div>

    <div class="metrics-grid">
      <div class="metric-item">
        <div class="metric-label">Dinero Ahorrado</div>
        <div class="metric-value" id="money-saved">0.00 €</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Fumados hoy</div>
        <div class="metric-value smoke-today" id="cigs-smoked-today">0</div>
      </div>
    </div>
  </div>

  <!-- BOTONES DE ACCIÓN -->
  <div class="actions-grid">
    <button class="btn btn-clean" onclick="markDayClean()">
      <span>+1 Día Limpio</span>
    </button>
    <button class="btn btn-relapse" onclick="registerCigarette()">
      <span>- Fumé un cigarro</span>
    </button>
    <button class="btn btn-sos" onclick="openSOS()">
      <span>Alerta: Tengo ganas de fumar</span>
    </button>
  </div>

  <!-- CALENDARIO -->
  <div class="card">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="prevMonth()">◄</button>
      <div class="cal-title" id="cal-month-title">Mes Año</div>
      <button class="cal-nav-btn" onclick="nextMonth()">►</button>
    </div>

    <div class="cal-weekdays">
      <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <!-- GASTO SEMANAL -->
  <div class="card">
    <div class="settings-row">
      <span style="color: var(--text-dim);">Gasto estimado por semana (€):</span>
      <input type="number" step="0.5" id="weekly-spend" class="settings-input" value="7.00" onchange="updateWeeklySpend()">
    </div>
  </div>
</div>

<!-- MODAL SOS -->
<div class="sos-modal" id="sos-modal">
  <h2 style="font-size: 1.4rem; font-weight: 700;">Respira. El pico dura poco.</h2>
  <p style="color: var(--text-dim); font-size: 0.9rem; margin-top: 6px;">Aguanta 3 minutos antes de tomar cualquier decisión.</p>

  <div class="breath-box">
    <div class="breath-clock" id="sos-timer">03:00</div>
    <span style="font-size: 0.8rem; color: var(--text-dim);" id="sos-phase">Inhala</span>
  </div>

  <button class="btn btn-clean" style="width: 200px;" onclick="closeSOS()">
    He aguantado
  </button>
</div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
